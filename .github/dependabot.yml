version: 2

updates:
  # Frontend
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

      ui:
        patterns:
          - "framer-motion"
          - "lucide-react"

      misc:
        patterns:
          - "*"

  # Backend
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:30"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      core:
        patterns:
          - "express"
          - "axios"
          - "cors"

      trading-risk:
        patterns:
          - "*ccxt*"
          - "*ws*"

      misc:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
