# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
labels:
  - "dependencies"
  # 🔹 Frontend (Vite / React app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

      ui:
        patterns:
          - "@headlessui/*"
          - "@radix-ui/*"
          - "framer-motion"
          - "lucide-react"

      linting:
        patterns:
          - "eslint*"
          - "prettier"
          - "@typescript-eslint/*"

      misc:
        patterns:
          - "*"
          
  trading-risk:
    patterns:
      - "*ccxt*"
      - "*bybit*"
      - "*binance*"
      - "*okx*"
      - "*kucoin*"
      - "*ws*"
    labels:
      - "risk:trading"

  misc:
    patterns:
      - "*"
  # 🔹 Backend / trading engine
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:30"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
groups:
      core:
        patterns:
          - "express"
          - "axios"
          - "cors"

      trading:
        patterns:
          - "*ccxt*"
          - "*ws*"

      misc:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # 🔹 GitHub Actions (CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
