version: 2

updates:
  # 🔹 Frontend (Vite / React app)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
  trading-risk:
    patterns:
      - "*ccxt*"
      - "*bybit*"
      - "*binance*"
      - "*okx*"
      - "*kucoin*"
      - "*ws*"

  react:
    patterns:
      - "react"
      - "react-dom"

  misc:
    patterns:
      - "*"

      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

      ui:
        patterns:
          - "@headlessui/*"
          - "@radix-ui/*"
          - "framer-motion"
          - "lucide-react"

      linting:
        patterns:
          - "eslint*"
          - "prettier"
          - "@typescript-eslint/*"

      misc:
        patterns:
          - "*"

  # 🔹 Backend / trading engine
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "06:30"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "deps(backend)"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    groups:
      trading-risk:
        patterns:
          - "*ccxt*"
          - "*ws*"
        labels:
          - "risk:trading"

      core:
        patterns:
          - "express"
          - "axios"
          - "cors"

      misc:
        patterns:
          - "*"

  # 🔹 GitHub Actions (CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
