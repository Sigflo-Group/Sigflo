name: Dependabot Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    runs-on: ubuntu-latest

    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

       - name: Enable auto-merge
  if: |
    (steps.metadata.outputs.update-type == 'version-update:semver-patch' || 
     steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
    !contains(steps.metadata.outputs.dependency-names, 'ccxt') &&
    !contains(steps.metadata.outputs.dependency-names, 'bybit') &&
    !contains(steps.metadata.outputs.dependency-names, 'binance') &&
    !contains(steps.metadata.outputs.dependency-names, 'okx') &&
    !contains(steps.metadata.outputs.dependency-names, 'kucoin')
  uses: peter-evans/enable-pull-request-automerge@v3
  with:
    pull-request-number: ${{ github.event.pull_request.number }}
    merge-method: squash
