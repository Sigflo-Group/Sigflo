# Sigflo — Netlify production deploy
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Functions need API keys in the Netlify UI: Site settings → Environment variables
# (e.g. OPENAI_API_KEY / AI_API_KEY for ai-suggest; see market-news-scan-core.mjs for news scan).
# Local: root `.env`, `.env.local`, or `backend/.env` (merged by load-root-env.mjs).
#
# Subpath (e.g. app at sigflo.group/feed): set build env VITE_BASE=/feed/ (NOT /feed/api — that is wrong).
# Below: /feed/assets/* and /feed/api/* so Vite’s /feed/ base works on Netlify.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # If the site has NODE_ENV=production, npm omits devDependencies and `npm run build` fails
  # (`tsc` / `vite` not found). Keep devDeps for the build; Vite still emits a production bundle.
  NPM_CONFIG_PRODUCTION = "false"
  # Prevent OOM during tsc + vite build on Netlify's build runners (default heap is ~512 MB).
  NODE_OPTIONS = "--max-old-space-size=4096"

# Bundle serverless functions (ESM imports from netlify/functions/lib/*).
[functions]
  node_bundler = "esbuild"

# Exchange API → proxy function to Railway backend.
[[redirects]]
  from = "/api/exchange/*"
  to = "/.netlify/functions/exchange-proxy"
  status = 200
  force = true

# Same under VITE_BASE=/feed/
[[redirects]]
  from = "/feed/api/exchange/*"
  to = "/.netlify/functions/exchange-proxy"
  status = 200
  force = true

# API routes → functions (must appear before the SPA catch‑all).
[[redirects]]
  from = "/api/ai/suggest"
  to = "/.netlify/functions/ai-suggest"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/news-scan"
  to = "/.netlify/functions/market-news-scan"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/beta"
  to = "/.netlify/functions/admin-beta"
  status = 200
  force = true

# Same APIs when the app uses VITE_BASE=/feed/ (resolveAppApiPath → /feed/api/...)
[[redirects]]
  from = "/feed/api/ai/suggest"
  to = "/.netlify/functions/ai-suggest"
  status = 200
  force = true

[[redirects]]
  from = "/feed/api/ai/news-scan"
  to = "/.netlify/functions/market-news-scan"
  status = 200
  force = true

[[redirects]]
  from = "/feed/api/admin/beta"
  to = "/.netlify/functions/admin-beta"
  status = 200
  force = true

# Vite base=/feed/ still emits files under dist/assets/; map /feed/assets/* → /assets/*
[[redirects]]
  from = "/feed/assets/*"
  to = "/assets/:splat"
  status = 200

# Netlify Dev + Vite base=/feed/: preserve module/HMR requests before SPA fallback.
[[redirects]]
  from = "/feed/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/feed/@react-refresh"
  to = "/@react-refresh"
  status = 200

[[redirects]]
  from = "/feed/src/*"
  to = "/src/:splat"
  status = 200

[[redirects]]
  from = "/feed/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

# Netlify Dev (root requests): avoid rewriting Vite module/HMR URLs to index.html.
[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/@react-refresh"
  to = "/@react-refresh"
  status = 200

[[redirects]]
  from = "/@id/*"
  to = "/@id/:splat"
  status = 200

[[redirects]]
  from = "/@fs/*"
  to = "/@fs/:splat"
  status = 200

[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

# React Router under /feed (sigflo.group/feed, /feed/trade, …)
[[redirects]]
  from = "/feed"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/feed/*"
  to = "/index.html"
  status = 200

# Site root or other paths (if this deploy is the whole site).
# Netlify serves real files under publish/ before these rules — e.g. `public/privacy/index.html` → `/privacy/index.html`.
# Unmatched paths hit the SPA; React must define routes (see App.tsx). A missing route + `path="*"` → /feed was why /privacy redirected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 3999
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security (effective once the site is served over HTTPS). Enable “Force HTTPS” + SSL in Netlify → Domain management.

# Legal doc pages are loaded in iframes by the SPA — allow same-origin framing.
[[headers]]
  for = "/disclosure/index.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/terms/index.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/privacy/index.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
